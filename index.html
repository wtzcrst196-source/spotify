<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>

<title>Spotify Clone</title>

</head>

<body class="bg-black text-white">

<div class="p-4">

<h1 class="text-2xl font-bold">Spotify Web</h1>

</div>

<!-- PLAYER -->

<div class="p-4">

<h2 id="songTitle">No song</h2>

<button id="playBtn">Play</button>
<button id="nextBtn">Next</button>
<button id="prevBtn">Prev</button>

</div>

<!-- SEARCH -->

<div class="p-4">

<input id="searchInput" placeholder="Search music..." class="text-black p-2 w-full">

<div id="searchResults"></div>

</div>

<!-- LIBRARY -->

<div class="p-4">

<h2>Your Library</h2>

<div id="library"></div>

</div>

<!-- UPLOAD -->

<div class="p-4">

<input type="file" id="uploadMusic" accept="audio/*" multiple>

</div>

<audio id="audioPlayer"></audio>

<script src="player.js"></script>
<script src="app.js"></script>

</body>
</html>
