<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Now Playing - Midnight Pulse</title>
<!-- BEGIN: External Scripts -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- END: External Scripts -->
<style data-purpose="custom-animations">
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: rotate-slow 20s linear infinite;
    }
    .pause-animation {
      animation-play-state: paused;
    }
  </style>
<style data-purpose="layout-styles">
    body {
      background-color: #020617; /* Slate 950 */
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .glass-effect {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* Simple custom slider styling for mobile feel */
    input[type='range']::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- BEGIN: Mobile Container -->
<main class="relative w-full max-w-[390px] h-[844px] bg-slate-950 flex flex-col overflow-hidden shadow-2xl border border-slate-800 rounded-[3rem]">
<!-- BEGIN: Background Gradient Glows -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-blue-900/30 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-indigo-900/30 rounded-full blur-[100px]"></div>
<!-- END: Background Gradient Glows -->
<!-- BEGIN: Header -->
<header class="z-10 px-8 pt-12 pb-6 flex items-center justify-between">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-slate-800 transition-colors">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<h1 class="text-sm font-semibold tracking-wider uppercase opacity-80">Now Playing</h1>
<button aria-label="More options" class="p-2 rounded-full hover:bg-slate-800 transition-colors">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: Album Art Section -->
<section class="flex-1 flex items-center justify-center px-8" data-purpose="album-art-container">
<div class="relative w-72 h-72">
<!-- Glow effect behind disk -->
<div class="absolute inset-0 rounded-full bg-blue-500/20 blur-3xl scale-110"></div>
<!-- Rotating Album Art -->
<div class="w-full h-full rounded-full border-4 border-slate-800/50 shadow-2xl overflow-hidden animate-spin-slow p-1" id="album-art">
<div class="w-full h-full rounded-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAkivWKatc8nO8t-Q5_CzPikKNGbi_3XQcL_9nZk2DIoW2TPLofHo3bz3WNBfdukQzTEhTNozwYjVkRYbkQZzsOOYikFL0gsK2rlxeWzkTp9hw4ojtMSKBFB1JJTS_NWHPI9W8ZX9M1oq7N8_amYAxajklTkq77qseqZPTKwDdW5ztD_fHySHBIEJQ1GjrxSq4yRu9xQwOdKHoNZ_R5tQFY3hBTtb9YvfQjxtFjP8D_qmvbEBuljjkc57bIwtPUXcKFvtvZ9O1-BKE');">
<!-- Center hole for vinyl record look -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-12 h-12 bg-slate-950 rounded-full border-4 border-slate-800/80 shadow-inner flex items-center justify-center">
<div class="w-2 h-2 bg-blue-500 rounded-full"></div>
</div>
</div>
</div>
</div>
</div>
</section>
<!-- END: Album Art Section -->
<!-- BEGIN: Song Info Section -->
<section class="z-10 px-8 text-center mt-4">
<h2 class="text-2xl font-bold tracking-tight text-white mb-1">Midnight Pulse</h2>
<p class="text-blue-400 font-medium">Echo System</p>
</section>
<!-- END: Song Info Section -->
<!-- BEGIN: Controls Section -->
<section class="z-10 px-8 pt-10 pb-16 flex flex-col space-y-8" data-purpose="playback-controls">
<!-- Progress Bar Container -->
<div class="space-y-2">
<input class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" data-purpose="progress-slider" max="100" min="0" type="range" value="35"/>
<div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-widest">
<span>00:00</span>
<span>00:00</span>
</div>
</div>
<!-- Main Playback Buttons -->
<div class="flex items-center justify-between px-4">
<button aria-label="Shuffle" class="text-slate-400 hover:text-white transition-colors">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m16 3 5 5-5 5"></path><path d="M3 21v-2a4 4 0 0 1 4-4h5"></path><path d="m5 16-3-3 3-3"></path><path d="M21 16v5h-11"></path></svg>
</button>
<div class="flex items-center space-x-8">
<button aria-label="Previous Track" class="text-white hover:text-blue-400 transition-colors transition-transform">
<svg fill="currentColor" height="28" stroke="none" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg"><path d="M19 20V4l-11 8 11 8zm-8-8L19 4V20l-8-8zm-2 8V4H7v16h2z"></path></svg>
</button>
<button aria-label="Play/Pause" class="w-20 h-20 flex items-center justify-center rounded-full bg-blue-600 text-white shadow-lg shadow-blue-900/40 hover:scale-105 active:scale-95 transition-all" id="play-pause-btn">
<svg class="hidden ml-1" fill="currentColor" height="32" id="play-icon" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="m7 4 12 8-12 8V4z"></path></svg>
<svg fill="currentColor" height="32" id="pause-icon" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><rect height="16" rx="1" width="4" x="6" y="4"></rect><rect height="16" rx="1" width="4" x="14" y="4"></rect></svg>
</button>
<button aria-label="Next Track" class="text-white hover:text-blue-400 transition-colors transition-transform">
<svg fill="currentColor" height="28" stroke="none" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg"><path d="M5 4v16l11-8-11-8zm8 8-8 8V4l8 8zm2 8V4h2v16h-2z"></path></svg>
</button>
</div>
<button aria-label="Repeat" class="text-slate-400 hover:text-white transition-colors">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m17 2 4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
</button>
</div>

</button>
</div>
</section>
<!-- END: Controls Section -->
<!-- Home Indicator (iOS style) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-800 rounded-full"></div>
</main>
<!-- END: Mobile Container -->
<!-- BEGIN: Logic -->
<script src="song.js"></script>  
<script data-purpose="toggle-playback">const audio = new Audio();
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const albumArt = document.getElementById('album-art');
    const progressSlider = document.querySelector('[data-purpose="progress-slider"]');
    const currentTimeEl = progressSlider.nextElementSibling.firstElementChild;
    const totalTimeEl = progressSlider.nextElementSibling.lastElementChild;
    const songTitle = document.querySelector('h2');
    const songArtist = document.querySelector('p.text-blue-400');
    const nextBtn = document.querySelector('[aria-label="Next Track"]');
    const prevBtn = document.querySelector('[aria-label="Previous Track"]');
    const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const repeatBadge = document.getElementById('repeat-badge');
        
        let isShuffle = false;
        let repeatMode = 0; // 0: None, 1: All, 2: One
    

    

    let songIndex = 0;
    audio.currentTime = 0
    function loadSong(song) {
  songTitle.textContent = song.title;
  songArtist.textContent = song.artist;
  audio.src = song.audio;
  albumArt.querySelector('div').style.backgroundImage = `url('${song.cover}')`;

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: "Now Playing",
      artwork: [
        { src: song.cover, sizes: "512x512", type: "image/png" }
      ]
    });
  }
}

    function playSong() {
      audio.play();
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      albumArt.classList.remove('pause-animation');
    }

    function pauseSong() {
      audio.pause();
      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      albumArt.classList.add('pause-animation');
    }

    function prevSong() {
      songIndex--;
      if (songIndex < 0) songIndex = songs.length - 1;
      loadSong(songs[songIndex]);
      playSong();
    }

    function nextSong() {
            if (repeatMode === 2) {
                // Repeat One
                audio.currentTime = 0;
            } else if (isShuffle) {
                SongIndex = Math.floor(Math.random() * songs.length);
            } else {
                SongIndex = (SongIndex + 1) % songs.length;
                if (SongIndex === 0 && repeatMode === 0) {
                    pauseSong();
                    return;
                }
            }
            // Since we don't have actual URLs for other songs, we just restart or stay on current for demo
            audio.currentTime = 0;
            playSong();
        }
     // Shuffle Toggle
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-blue-500', isShuffle);
            shuffleBtn.classList.toggle('text-slate-400', !isShuffle);
        });

        // Repeat Cycles
        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.replace('text-blue-500', 'text-slate-400');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 1) {
                repeatBtn.classList.replace('text-slate-400', 'text-blue-500');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 2) {
                repeatBadge.classList.remove('hidden');
            }
        });


    function updateProgress(e) {
      const { duration, currentTime } = e.srcElement;
      if (duration) {
        const progressPercent = (currentTime / duration) * 100;
        progressSlider.value = progressPercent;
        
        // Update time displays
        currentTimeEl.textContent = formatTime(currentTime);
        totalTimeEl.textContent = formatTime(duration);
      }
    }

    function setProgress(e) {
      const width = this.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (progressSlider.value / 100) * duration;
    }

    function formatTime(time) {
      const min = Math.floor(time / 60);
      const sec = Math.floor(time % 60);
      return `${min}:${sec < 10 ? '0' + sec : sec}`;
    }

    // Event Listeners
    playPauseBtn.addEventListener('click', () => {
      const isPlaying = !audio.paused;
      if (isPlaying) {
        pauseSong();
      } else {
        playSong();
      }
    });

    nextBtn.addEventListener('click', nextSong);
    prevBtn.addEventListener('click', prevSong);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    progressSlider.addEventListener('input', () => {
      const duration = audio.duration;
      audio.currentTime = (progressSlider.value / 100) * duration;
    });

    // Initial Load
    loadSong(songs[songIndex]);
    // Start with animation paused until play
    albumArt.classList.add('pause-animation');</script>
<!-- END: Logic -->
</body></html>
