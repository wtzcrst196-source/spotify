<script>
        // PLAYER LOGIC
        const audio = new Audio();
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const albumArt = document.getElementById('album-art');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const repeatBadge = document.getElementById('repeat-badge');
        
        let isShuffle = false;
        let repeatMode = 0; // 0: None, 1: All, 2: One
        let currentSongIndex = 0;

        const songs = [
            { title: "Midnight Pulse", artist: "Echo System", cover: "https://lh3.googleusercontent.com/aida-public/AB6AXuAkivWKatc8nO8t-Q5_CzPikKNGbi_3XQcL_9nZk2DIoW2TPLofHo3bz3WNBfdukQzTEhTNozwYjVkRYbkQZzsOOYikFL0gsK2rlxeWzkTp9hw4ojtMSKBFB1JJTS_NWHPI9W8ZX9M1oq7N8_amYAxajklTkq77qseqZPTKwDdW5ztD_fHySHBIEJQ1GjrxSq4yRu9xQwOdKHoNZ_R5tQFY3hBTtb9YvfQjxtFjP8D_qmvbEBuljjkc57bIwtPUXcKFvtvZ9O1-BKE", audio: "" },
            { title: "Neon Drift", artist: "Synth Wave", cover: "https://lh3.googleusercontent.com/aida-public/AB6AXuAkivWKatc8nO8t-Q5_CzPikKNGbi_3XQcL_9nZk2DIoW2TPLofHo3bz3WNBfdukQzTEhTNozwYjVkRYbkQZzsOOYikFL0gsK2rlxeWzkTp9hw4ojtMSKBFB1JJTS_NWHPI9W8ZX9M1oq7N8_amYAxajklTkq77qseqZPTKwDdW5ztD_fHySHBIEJQ1GjrxSq4yRu9xQwOdKHoNZ_R5tQFY3hBTtb9YvfQjxtFjP8D_qmvbEBuljjkc57bIwtPUXcKFvtvZ9O1-BKE", audio: "" }
        ];

        function playSong() {
            audio.play().catch(e => console.log("Audio play failed"));
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            albumArt.classList.remove('pause-animation');
        }
        function pauseSong() {
            audio.pause();
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            albumArt.classList.add('pause-animation');
        }

        function nextSong() {
            if (repeatMode === 2) {
                // Repeat One
                audio.currentTime = 0;
            } else if (isShuffle) {
                currentSongIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentSongIndex = (currentSongIndex + 1) % songs.length;
                if (currentSongIndex === 0 && repeatMode === 0) {
                    pauseSong();
                    return;
                }
            }
            // Since we don't have actual URLs for other songs, we just restart or stay on current for demo
            audio.currentTime = 0;
            playSong();
        }

        audio.addEventListener('ended', nextSong);

        playPauseBtn.addEventListener('click', () => audio.paused ? playSong() : pauseSong());
        albumArt.classList.add('pause-animation');

        // Shuffle Toggle
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-blue-500', isShuffle);
            shuffleBtn.classList.toggle('text-slate-400', !isShuffle);
        });

        // Repeat Cycles
        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.replace('text-blue-500', 'text-slate-400');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 1) {
                repeatBtn.classList.replace('text-slate-400', 'text-blue-500');
                repeatBadge.classList.add('hidden');
            } else if (repeatMode === 2) {
                repeatBadge.classList.remove('hidden');
            }
        });

        // UPLOAD LOGIC
        const overlay = document.getElementById('upload-overlay');
        const openBtn = document.getElementById('open-upload-btn');
        const closeBtn = document.getElementById('close-upload');

        const toggleUpload = (show) => {
            if(show) {
                overlay.classList.remove('overlay-hidden');
                overlay.classList.add('overlay-visible');
            } else {
                overlay.classList.remove('overlay-visible');
                overlay.classList.add('overlay-hidden');
            }
        };

        openBtn.addEventListener('click', () => toggleUpload(true));
        closeBtn.addEventListener('click', () => toggleUpload(false));
        overlay.addEventListener('click', (e) => e.target === overlay && toggleUpload(false));

        const coverInput = document.getElementById('cover-input');
        const audioInput = document.getElementById('audio-input');
        const coverStatus = document.getElementById('cover-status');
        const audioStatus = document.getElementById('audio-status');
        const finalBtn = document.getElementById('final-upload-btn');

        coverInput.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                coverStatus.textContent = "Image: " + e.target.files[0].name;
                coverStatus.classList.add('text-green-400');
                checkInputs();
            }
        });

        audioInput.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                audioStatus.textContent = "Audio: " + e.target.files[0].name;
                finalBtn.classList.remove('bg-slate-800', 'text-slate-400');
                finalBtn.classList.add('bg-blue-600', 'text-white');
                checkInputs();
            }
        });

        function checkInputs() {
            if(coverInput.files[0] && audioInput.files[0]) {
                finalBtn.textContent = "Ready to Upload!";
            }
        }
    </script>
<style>

            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%233B82F6FF' stroke-width='2' stroke-dasharray='8%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
