<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Music Player</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
@keyframes rotate-slow{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.play{
animation:rotate-slow 20s linear infinite;
}

body{
background:#020617;
color:white;
font-family:sans-serif;
}

.seek-bar::-webkit-slider-thumb{
-webkit-appearance:none;
height:12px;
width:12px;
border-radius:50%;
background:#3b82f6;
cursor:pointer;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<main class="relative w-full max-w-[390px] h-[844px] bg-slate-950 flex flex-col overflow-hidden shadow-2xl border border-slate-800 rounded-[3rem]">

<header class="px-8 pt-12 pb-6 flex items-center justify-between">
<button>←</button>
<h1 class="text-sm font-semibold uppercase">Now Playing</h1>
<button>⋮</button>
</header>


<!-- Album -->

<section class="flex-1 flex items-center justify-center px-8">

<div class="relative w-72 h-72">

<div id="box-disk" class="w-full h-full rounded-full border-4 border-slate-800 overflow-hidden bg-cover bg-center">
</div>

</div>

</section>


<!-- Song info -->

<section class="px-8 text-center">

<h2 class="song-name text-2xl font-bold mb-1">Song name</h2>

<p class="artist text-blue-400">Artist</p>

</section>


<!-- Progress -->

<section class="px-8 pt-8">

<input id="seekbar" type="range" value="0" min="0"
class="seek-bar w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer">

<div class="flex justify-between text-xs text-gray-400 mt-2">

<span class="current-time">00:00</span>

<span class="music-time">00:00</span>

</div>

</section>


<!-- Controls -->

<section class="px-8 pt-10 pb-16">

<div class="flex items-center justify-center space-x-10">

<button id="btnback">⏮</button>

<button id="play-pause-btn"
class="btn-play w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center">

▶

</button>

<button id="btnnext">⏭</button>

</div>

</section>

<audio id="audio"></audio>

</main>


<script src="song.js"></script>
<script src="script.js"></script>

</body>
</html>
